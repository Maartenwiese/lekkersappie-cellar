name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release for HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP archive for HACS release
        run: |
          cd "${{ github.workspace }}/custom_components"
          zip -r "${{ github.workspace }}/wine_inventory.zip" wine_inventory

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wine_inventory.zip
          generate_release_notes: true
